<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gate-to-Gate · Passwort-Hash</title>
<style>
 body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;max-width:720px;margin:30px auto;padding:0 18px;color:#1a1f28;background:#f4f6f9}
 h1{font-size:20px} .card{background:#fff;border:1px solid #e4e8ee;border-radius:14px;padding:18px 20px;margin:14px 0;box-shadow:0 10px 30px -18px rgba(0,0,0,.3)}
 label{display:block;font-size:12px;font-weight:700;color:#6b7684;margin:10px 0 4px}
 input,select{width:100%;box-sizing:border-box;padding:10px 12px;border:1.5px solid #e4e8ee;border-radius:10px;font:inherit;font-size:14px}
 .row{display:flex;gap:12px;flex-wrap:wrap} .row>div{flex:1;min-width:160px}
 button{margin-top:14px;padding:11px 18px;border:none;border-radius:10px;background:#da291c;color:#fff;font:inherit;font-weight:800;cursor:pointer}
 pre{background:#0e1116;color:#e6edf3;padding:14px;border-radius:10px;overflow:auto;font-size:12.5px;white-space:pre-wrap;word-break:break-all}
 .muted{color:#6b7684;font-size:12.5px;line-height:1.5}
 code{background:#eef1f5;padding:1px 5px;border-radius:5px}
</style></head><body>
<h1>Gate-to-Gate · Passwort-Hash erzeugen</h1>
<p class="muted">Erzeugt den Prüfsummen-Eintrag für <code>users.json</code>. Nichts verlässt dieses Gerät – alles rechnet lokal im Browser. Danach den erzeugten Eintrag in <code>users.json</code> einfügen/ersetzen und pushen.</p>
<div class="card">
 <div class="row">
  <div><label>E-Mail (Login)</label><input id="e" type="email" placeholder="vorname.nachname@swiss-ski.ch"></div>
  <div><label>Passwort</label><input id="p" type="text" placeholder="Passwort"></div>
 </div>
 <div class="row">
  <div><label>Name</label><input id="n" type="text" placeholder="Vorname Nachname"></div>
  <div><label>Rolle</label><select id="r"><option value="coach">coach</option><option value="admin">admin (Direktor)</option></select></div>
 </div>
 <div><label>Gruppen (Komma-getrennt, wie in der Liste)</label><input id="g" type="text" placeholder="Frauen Elite EC 1, Test Gruppe 2"></div>
 <div class="row">
  <div><label>Salt</label><input id="salt" value="g2g_v1_7Kx9"></div>
  <div><label>Runden (hn)</label><input id="hn" value="30000"></div>
 </div>
 <button id="go">Eintrag erzeugen</button>
 <p class="muted" id="status"></p>
 <pre id="out"></pre>
</div>
<script>
function gtgSha256(ascii){ ascii=unescape(encodeURIComponent(ascii));
 function rr(v,a){return (v>>>a)|(v<<(32-a));}
 var mp=Math.pow, mw=mp(2,32), result='', words=[], bitLen=ascii.length*8;
 var hash=gtgSha256.h=gtgSha256.h||[], k=gtgSha256.k=gtgSha256.k||[], pc=k.length, comp={};
 for(var cand=2;pc<64;cand++){ if(!comp[cand]){ for(var i=0;i<313;i+=cand){comp[i]=cand;} hash[pc]=(mp(cand,.5)*mw)|0; k[pc++]=(mp(cand,1/3)*mw)|0; } }
 ascii+='\x80'; while(ascii.length%64-56)ascii+='\x00';
 for(var i=0;i<ascii.length;i++){ var j=ascii.charCodeAt(i); if(j>>8)return; words[i>>2]|=j<<((3-i)%4)*8; }
 words[words.length]=((bitLen/mw)|0); words[words.length]=(bitLen);
 for(var j=0;j<words.length;){
  var w=words.slice(j,j+=16), oldHash=hash; hash=hash.slice(0,8);
  for(var i=0;i<64;i++){ var w15=w[i-15], w2=w[i-2], a=hash[0], e=hash[4];
   var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=i<16?(w[i]|0):(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
   var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
   hash=[(t1+t2)|0].concat(hash); hash[4]=(hash[4]+t1)|0; }
  for(var i=0;i<8;i++){hash[i]=(hash[i]+oldHash[i])|0;}
 }
 for(var i=0;i<8;i++){ for(var j=3;j+1;j--){ var b=(hash[i]>>(j*8))&255; result+=((b<16)?0:'')+b.toString(16); } }
 return result;
}
function hashPw(email,pw,salt,hn){ var x=salt+':'+String(email).toLowerCase()+':'+pw; for(var i=0;i<hn;i++){ x=gtgSha256(x); } return x; }
document.getElementById('go').onclick=function(){
 var e=document.getElementById('e').value.trim().toLowerCase();
 var p=document.getElementById('p').value;
 if(!e||!p){ document.getElementById('status').textContent='Bitte E-Mail und Passwort eingeben.'; return; }
 document.getElementById('status').textContent='Rechne… (einige Sekunden)';
 setTimeout(function(){
  var salt=document.getElementById('salt').value, hn=parseInt(document.getElementById('hn').value,10)||30000;
  var h=hashPw(e,p,salt,hn);
  var g=document.getElementById('g').value.split(',').map(function(s){return s.trim();}).filter(Boolean);
  var entry={e:e,h:h,r:document.getElementById('r').value,g:g,n:document.getElementById('n').value.trim()};
  document.getElementById('out').textContent=JSON.stringify(entry);
  document.getElementById('status').textContent='Fertig – diesen Eintrag in users.json einfügen (vorhandene E-Mail ersetzen).';
 },30);
};
</script>
</body></html>
